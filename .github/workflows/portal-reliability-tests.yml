name: Signed-in portal reliability

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/ci/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portal-reliability-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/ci/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portal-reliability-tests.yml"

concurrency:
  group: portal-reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signed-in-portals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm install --legacy-peer-deps

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Start isolated local Supabase
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy,mailpit

      - name: Apply migrations to a clean local database
        run: supabase db reset --local

      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "CI_TEST_PASSWORD=Local-Only-Test-Password-2026!" >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Seed isolated school and role fixtures
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/portal_reliability_seed.sql

      - name: Verify local Supabase password authentication before browser tests
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg email 'ci-student@masterminds.test' --arg password "$CI_TEST_PASSWORD" '{email: $email, password: $password}')"
          response="$(curl --silent --show-error --fail-with-body \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$VITE_SUPABASE_URL/auth/v1/token?grant_type=password")"
          access_token="$(jq -r '.access_token // empty' <<< "$response")"
          if [[ -z "$access_token" ]]; then
            echo "::error::Local Supabase Auth did not issue an access token for the CI fixture."
            jq '{error, error_description, msg}' <<< "$response"
            exit 1
          fi
          echo "Local Supabase Auth issued a session for the seeded CI student."

      - name: Install Playwright test runner
        run: npm install --no-save --legacy-peer-deps @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test signed-in portals on desktop and mobile
        run: npx playwright test tests/e2e/signed-in-portals.spec.ts --project=desktop-chromium --project=mobile-chromium


      - name: Diagnose Supabase Auth failure
        if: failure()
        shell: bash
        run: |
          echo "=== Auth containers ==="
          docker ps --format '{{.Names}} {{.Image}}' | grep -E 'auth|supabase' || true
          AUTH_CONTAINER="$(docker ps --format '{{.Names}}' | grep -E 'supabase_auth|auth' | head -n 1)"
          if [ -n "$AUTH_CONTAINER" ]; then
            docker logs "$AUTH_CONTAINER" --tail 250 2>&1 || true
          fi
          echo "=== Auth fixture records ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select u.id,u.email,u.instance_id,u.aud,u.role,u.email_confirmed_at,i.provider,i.provider_id,i.identity_data from auth.users u left join auth.identities i on i.user_id=u.id where u.email like 'ci-%@masterminds.test' order by u.email;"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
