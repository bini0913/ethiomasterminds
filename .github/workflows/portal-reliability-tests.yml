name: Signed-in portal reliability

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/ci/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portal-reliability-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/ci/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portal-reliability-tests.yml"

concurrency:
  group: portal-reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signed-in-portals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm install --legacy-peer-deps

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Start isolated local Supabase
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy,mailpit

      - name: Apply migrations to a clean local database
        run: supabase db reset --local

      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "CI_TEST_PASSWORD=Local-Only-Test-Password-2026!" >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Seed isolated school and role fixtures
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/portal_reliability_seed.sql

      - name: Install Playwright test runner
        run: npm install --no-save --legacy-peer-deps @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test signed-in portals on desktop and mobile
        run: npx playwright test tests/e2e/signed-in-portals.spec.ts --project=desktop-chromium --project=mobile-chromium

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
