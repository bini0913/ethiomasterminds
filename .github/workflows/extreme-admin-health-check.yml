name: Extreme Admin health-check validation

on:
  pull_request:
    paths:
      - "supabase/functions/extreme-admin-health-check/**"
      - "supabase/functions/send-push-notification/**"
      - ".github/workflows/extreme-admin-health-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-function-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2

      - name: Type-check Extreme Admin health check
        run: deno check --node-modules-dir=auto supabase/functions/extreme-admin-health-check/index.ts

      - name: Type-check notification delivery diagnostics
        run: deno check --node-modules-dir=auto supabase/functions/send-push-notification/index.ts
