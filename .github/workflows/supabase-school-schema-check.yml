name: Supabase school schema checks

on:
  push:
    branches:
      - main
      - feat/school-management-portals-foundation
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/seed.sql"
      - ".github/workflows/supabase-school-schema-check.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/seed.sql"
      - ".github/workflows/supabase-school-schema-check.yml"

concurrency:
  group: school-schema-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate unique migration versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter

          files = list(Path("supabase/migrations").glob("*.sql"))
          versions = [path.name.split("_", 1)[0] for path in files]
          duplicates = sorted(version for version, count in Counter(versions).items() if count > 1)
          if duplicates:
              raise SystemExit(
                  "Duplicate Supabase migration version(s): " + ", ".join(duplicates)
              )
          PY
      - uses: supabase/setup-cli@v1
        id: setup-supabase-cli
        with:
          version: 3.0.0
      - name: Start local Supabase services
        # Inbucket is only a local email-capture service. Database migration
        # replay and pgTAP do not require it, and its default host port can
        # collide with ports reserved by hosted CI runners.
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy,inbucket
      - name: Apply every migration from a clean database
        run: supabase db reset --local
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Stop local Supabase services
        if: always() && steps.setup-supabase-cli.outcome == 'success'
        run: supabase stop --no-backup

  edge-function-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check school account provisioning function
        run: deno check --node-modules-dir=auto supabase/functions/school-provision-account/index.ts

  migration-deploy-dry-run:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: mytbjkchvfybhyqcynnl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Dry-run pending migrations against production history
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          }
          test -n "${SUPABASE_DB_PASSWORD:-}" || {
            echo "::error::Missing SUPABASE_DB_PASSWORD repository secret."
            exit 1
          }
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          added_migrations="$(git diff --name-only --diff-filter=A --no-renames "$base_sha" "$head_sha" -- supabase/migrations)"
          if [[ -z "$added_migrations" ]]; then
            echo "No new migration files; skipping production history dry-run."
            exit 0
          fi
          bash scripts/ci/sync-supabase-migration-history.sh "$base_sha" "$head_sha"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run
