name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: mytbjkchvfybhyqcynnl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate access token
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"
            exit 1
          }

      - name: Deploy Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for dir in supabase/functions/*; do
            if [ -d "$dir" ] && [ -f "$dir/index.ts" ]; then
              name="$(basename "$dir")"
              echo "Deploying $name"
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID"
            fi
          done
