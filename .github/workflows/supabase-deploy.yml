name: Deploy Supabase production

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_ID: mytbjkchvfybhyqcynnl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo "::error::Missing SUPABASE_DB_URL repository secret"; exit 1; }

      - name: Push database migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Deploy Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for dir in supabase/functions/*; do
            if [ -d "$dir" ] && [ -f "$dir/index.ts" ]; then
              name="$(basename "$dir")"
              echo "Deploying $name"
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID"
            fi
          done
