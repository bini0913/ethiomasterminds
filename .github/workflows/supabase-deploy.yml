name: Deploy Supabase database and Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: mytbjkchvfybhyqcynnl
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate access token
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"
            exit 1
          }

      - name: Push database migrations
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" || true)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || grep -q '^supabase/migrations/' <<< "$changed_files"; then
            if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
              supabase db push --remote="$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --yes
            else
              echo "::warning::SUPABASE_DB_PASSWORD is not configured; database migrations were not pushed."
            fi
          else
            echo "No database migration changed; skipping database push."
          fi

      - name: Deploy Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" || true)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || grep -q '^supabase/functions/' <<< "$changed_files"; then
            for dir in supabase/functions/*; do
              if [ -d "$dir" ] && [ -f "$dir/index.ts" ]; then
                name="$(basename "$dir")"
                echo "Deploying $name"
                supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID"
              fi
            done
          else
            echo "No Edge Function changed; skipping function deployment."
          fi
