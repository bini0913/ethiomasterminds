name: Deploy Supabase database and Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: mytbjkchvfybhyqcynnl
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Validate access token
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"
            exit 1
          }

      - name: Push new database migrations
        shell: bash
        run: |
          set -euo pipefail

          # Manual dispatch is for Edge Function redeployment only. Database
          # changes are deployed from a main push containing new migration files.
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "Manual dispatch does not push database migrations."
            exit 0
          fi

          test -n "${GITHUB_EVENT_BEFORE:-}" || {
            echo "::error::Push event is missing its base SHA."
            exit 1
          }
          git cat-file -e "${GITHUB_EVENT_BEFORE}^{commit}" || {
            echo "::error::Push base commit is unavailable."
            exit 1
          }

          added_migrations="$(git diff --name-only --diff-filter=A --no-renames "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" -- supabase/migrations)"
          if [[ -z "$added_migrations" ]]; then
            echo "No new migration files were added; historical migration edits are not replayed."
            exit 0
          fi

          test -n "${SUPABASE_DB_PASSWORD:-}" || {
            echo "::error::SUPABASE_DB_PASSWORD is required to deploy database migrations."
            exit 1
          }

          # Production history was originally recorded through Supabase's
          # migration API, so its version IDs differ from the repository's
          # original filenames. Fetch the exact applied history first. This
          # keeps db push from replaying old migrations or repairing history
          # by deleting valid production records.
          source_dir="$(mktemp -d)"
          cp supabase/migrations/*.sql "$source_dir/"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -delete

          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase migration fetch --linked

          remote_max="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort -n | tail -n 1)"
          test -n "$remote_max" || {
            echo "::error::Could not fetch the production migration history."
            exit 1
          }

          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            file="$source_dir/$(basename "$path")"
            test -f "$file" || {
              echo "::error::New migration file was not found in the checked-out source: $path"
              exit 1
            }
            version="$(basename "$file" | cut -d_ -f1)"
            if [[ "$version" -le "$remote_max" ]]; then
              echo "::error::New migration $path has version $version, which is not later than production's latest version $remote_max. Create a fresh migration with a later timestamp."
              exit 1
            fi
            cp "$file" supabase/migrations/
          done <<< "$added_migrations"

          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          files = list(Path("supabase/migrations").glob("*.sql"))
          versions = [p.name.split("_", 1)[0] for p in files]
          duplicates = sorted(v for v, count in Counter(versions).items() if count > 1)
          if duplicates:
              raise SystemExit(f"Duplicate migration versions after history sync: {', '.join(duplicates)}")
          PY

          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            changed_files=""
          else
            test -n "${GITHUB_EVENT_BEFORE:-}" || {
              echo "::error::Push event is missing its base SHA; refusing to skip function deployment detection."
              exit 1
            }
            git cat-file -e "${GITHUB_EVENT_BEFORE}^{commit}" || {
              echo "::error::Push base commit is unavailable; refusing to skip function deployment detection."
              exit 1
            }
            changed_files="$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA")"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || grep -q '^supabase/functions/' <<< "$changed_files"; then
            test -n "$SUPABASE_ACCESS_TOKEN" || {
              echo "::error::SUPABASE_ACCESS_TOKEN is required to deploy Edge Functions."
              exit 1
            }
            for dir in supabase/functions/*; do
              if [ -d "$dir" ] && [ -f "$dir/index.ts" ]; then
                name="$(basename "$dir")"
                echo "Deploying $name"
                supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID" --yes
              fi
            done
          else
            echo "No Edge Function changed; skipping function deployment."
          fi
