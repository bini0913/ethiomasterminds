name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Install dependencies
        # package-lock.json is currently maintained by Lovable and can lag package.json.
        # npm install keeps CI usable until the lockfile is regenerated normally.
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npm run typecheck

      - name: Build web app
        env:
          VITE_SUPABASE_URL: https://mytbjkchvfybhyqcynnl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_GtWjzcVR3XxRddFfyxqeaA_5xZ33-lM' }}
          VITE_SUPABASE_PROJECT_ID: mytbjkchvfybhyqcynnl
        run: npx vite build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate release AAB build
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterMinds-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: MasterMinds-Android-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
