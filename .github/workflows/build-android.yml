name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Install dependencies
        # package-lock.json is currently maintained by Lovable and can lag package.json.
        # npm install keeps CI usable until the lockfile is regenerated normally.
        run: npm install --legacy-peer-deps

      - name: Verify route registry
        run: npm run check:routes

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web app
        env:
          VITE_SUPABASE_URL: https://mytbjkchvfybhyqcynnl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_GtWjzcVR3XxRddFfyxqeaA_5xZ33-lM' }}
          VITE_SUPABASE_PROJECT_ID: mytbjkchvfybhyqcynnl
        run: npx vite build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # PRs can validate the release build without access to production signing
      # secrets. A partial secret configuration is always an error.
      - name: Prepare protected release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=(
            "${ANDROID_KEYSTORE_BASE64}"
            "${ANDROID_KEYSTORE_PASSWORD}"
            "${ANDROID_KEY_ALIAS}"
            "${ANDROID_KEY_PASSWORD}"
          )
          present=0
          missing=0
          for value in "${values[@]}"; do
            if [[ -n "${value}" ]]; then
              ((present+=1))
            else
              ((missing+=1))
            fi
          done
          if [[ "${present}" -ne 0 && "${missing}" -ne 0 ]]; then
            echo "::error::Android signing secrets are incomplete. Configure all four secrets together."
            exit 1
          fi
          if [[ "${present}" -eq 0 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Android upload key configured. Release AAB will be build-tested but will not be published."
            exit 0
          fi
          keystore_path="$RUNNER_TEMP/master-minds-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo "::error::Decoded Android keystore is empty."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify packaged Android permissions and backup policy
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' variables.gradle
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          merged_manifest="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E 'merged_manifest|merged_manifests' | head -n 1)"
          if [[ -z "${merged_manifest}" ]]; then
            echo "::error::Merged Android manifest was not produced"
            exit 1
          fi
          for permission in READ_CONTACTS ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION; do
            if grep -q "android.permission.${permission}" "${merged_manifest}"; then
              echo "::error::Unexpected sensitive permission in merged manifest: ${permission}"
              exit 1
            fi
          done
          grep -q 'android.permission.CAMERA' "${merged_manifest}"
          grep -q 'android.permission.RECORD_AUDIO' "${merged_manifest}"
          grep -q 'android.permission.POST_NOTIFICATIONS' "${merged_manifest}"

      - name: Build release Android App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify signed release AAB and upload certificate
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundle="app/build/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          jarsigner -verify -verbose -certs "$bundle" > "$RUNNER_TEMP/aab-signature-check.txt" 2>&1
          grep -q 'jar verified.' "$RUNNER_TEMP/aab-signature-check.txt"

          keystore_fingerprint="$(
            keytool -list -v \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -alias "$ANDROID_KEY_ALIAS" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -keypass:env ANDROID_KEY_PASSWORD |
            sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 |
            tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          bundle_fingerprint="$(
            keytool -printcert -jarfile "$bundle" -v |
            sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 |
            tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"
          if [[ -z "$keystore_fingerprint" || -z "$bundle_fingerprint" ]]; then
            echo "::error::Could not read the SHA-256 upload certificate fingerprint."
            exit 1
          fi
          if [[ "$keystore_fingerprint" != "$bundle_fingerprint" ]]; then
            echo "::error::The AAB signer certificate does not match the configured upload key."
            exit 1
          fi
          echo "AAB signature verified; signer certificate matches the configured upload key."

      - name: Reject unsigned AAB from release publishing
        if: steps.signing.outputs.ready != 'true'
        run: |
          echo "Unsigned AAB is retained only as a CI build check; it is excluded from published release files."

      # Do not attach an AAB to a GitHub release unless its signature passed.
      - name: Prepare release download list
        if: github.ref == 'refs/heads/main'
        id: release_files
        shell: bash
        run: |
          {
            echo 'files<<EOF'
            echo 'android/app/build/outputs/apk/debug/app-debug.apk'
            if [[ "${{ steps.signing.outputs.ready }}" == "true" ]]; then
              echo 'android/app/build/outputs/bundle/release/app-release.aab'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish Android downloads
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Master Minds Android CI Build ${{ github.run_number }}
          body: |
            The Android App Bundle is attached only when its upload-key signature has passed CI verification.
            If no AAB is attached, signing credentials have not yet been configured.
          files: ${{ steps.release_files.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary Android upload keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/master-minds-upload-key.jks"
          rm -f "$RUNNER_TEMP/aab-signature-check.txt"

  public-route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      VITE_SUPABASE_URL: https://mytbjkchvfybhyqcynnl.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_GtWjzcVR3XxRddFfyxqeaA_5xZ33-lM' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install application dependencies
        run: npm install --legacy-peer-deps
      - name: Install Playwright test runner
        run: npm install --no-save --legacy-peer-deps @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify route registry
        run: npm run check:routes
      - name: Run public route browser smoke tests
        run: npx playwright test
