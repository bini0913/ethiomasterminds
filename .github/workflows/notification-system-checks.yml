name: Notification system checks

on:
  pull_request:
    paths:
      - "supabase/functions/send-push-notification/**"
      - "supabase/migrations/**"
      - "supabase/tests/notification_inbox.test.sql"
      - "src/lib/notifications.ts"
      - "src/lib/staffNotifications.ts"
      - "src/components/notifications/NotificationBootstrap.tsx"
      - "src/pages/NotificationInboxPage.tsx"
      - "src/pages/NotificationSettingsPage.tsx"
      - "src/components/multiplayer/RealTimeRoom.tsx"
      - "public/firebase-messaging-sw.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-function:
    name: Type-check push delivery and browser worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2

      - name: Type-check notification Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/send-push-notification/index.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check Firebase messaging service worker
        run: node --check public/firebase-messaging-sw.js
